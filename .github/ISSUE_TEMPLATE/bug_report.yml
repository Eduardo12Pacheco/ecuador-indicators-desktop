name: Bug report
description: Report a defect in the application, pipeline or tooling.
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Do not include secrets or personal data.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: A clear and concise description of the defect.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Click ...
        3. Observe ...
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Linux
        - Windows
        - macOS
        - Web preview
        - Data pipeline only
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: App version or commit SHA.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Redact paths, tokens and personal information.
      render: shell
    validations:
      required: false
