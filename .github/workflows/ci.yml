name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Lint and static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev \
            libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Biome
        run: npm run lint

      - name: TypeScript
        run: npm run typecheck

      - name: Rust format
        run: cargo fmt --all --check

      - name: Rust clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Sync Python environment
        working-directory: pipeline
        run: uv sync --frozen

      - name: Ruff
        working-directory: pipeline
        run: uv run ruff check . && uv run ruff format --check .

      - name: Mypy
        working-directory: pipeline
        run: uv run mypy --strict src

      - name: Install actionlint
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSfL https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            | tar -xz -C "$HOME/.local/bin" actionlint
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Actionlint
        run: actionlint

      - name: Install gitleaks
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | tar -xz -C "$HOME/.local/bin" gitleaks
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Gitleaks
        run: gitleaks git --no-banner --redact .

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev \
            libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Vitest
        run: npm test

      - name: Rust tests
        run: cargo test --workspace

      - name: Sync Python environment
        working-directory: pipeline
        run: uv sync --frozen

      - name: Pipeline tests
        working-directory: pipeline
        run: uv run pytest -q
