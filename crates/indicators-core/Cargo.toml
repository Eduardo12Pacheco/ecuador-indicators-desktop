[package]
name = "indicators-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Pure domain and application core for Ecuador Indicators"

[lib]
name = "indicators_core"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
ts-rs = "12"
semver = "1"
rusqlite = { version = "0.41", features = ["bundled"] }
rusqlite_migration = "2.7"
ureq = "3"
sha2 = "0.11"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
proptest = "1"
tempfile = "3"
httpmock = "0.9"
