fallback_description_es = "Emisiones anuales totales de dióxido de carbono (CO2), uno de los seis gases de efecto invernadero de Kioto, procedentes de los sectores agrícola, energético, de residuos e industrial, excluido el uso de la tierra y la silvicultura (UTCUTS), estandarizadas a valores equivalentes de CO2 y divididas por la población de la economía. Esta medida excluye los flujos de gases de efecto invernadero causados por el uso de la tierra, el cambio de uso de la tierra y la silvicultura (UTCUTS), ya que estos flujos tienen mayores incertidumbres."
fallback_source_org_es = "EDGAR (Base de Datos de Emisiones para la Investigación Atmosférica Global), Centro Común de Investigación (JRC) de la Comisión Europea"

