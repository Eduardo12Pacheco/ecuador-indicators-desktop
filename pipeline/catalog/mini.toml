# Mini catalog: a six-indicator, five-geography subset of the full curated
# catalog. It feeds `build --subset mini` and `export-json --subset mini`; the
# resulting fixtures are used by the Rust contract tests and the in-memory
# adapter. Every entry must match the full catalog (a test enforces it).

